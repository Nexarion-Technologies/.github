name: Bug report
description: Report a reproducible defect in a published Nexarion repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or non-sensitive data only. Do not include credentials, client information, private endpoints, tenant identifiers, or internal infrastructure details.
  - type: input
    id: repository_version
    attributes:
      label: Version or commit
      description: Release, tag, or commit SHA where the problem occurs.
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior and its practical impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence using synthetic or non-sensitive data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime, container, and relevant dependency versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Publication check
      options:
        - label: I removed secrets, personal data, client information, private endpoints, tenant identifiers, and internal infrastructure details.
          required: true
        - label: This is not an unpatched security vulnerability.
          required: true
